name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew --console=plain :phone:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: heartline-phone-debug
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: heartline-wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APKs are uploaded before checks so a red check never blocks downloading them.
      - name: Lint
        run: ./gradlew --console=plain ktlintCheck

      - name: Unit, Robolectric and Paparazzi tests
        run: ./gradlew --console=plain test verifyPaparazziDebug

      # R8-minified release build (signed with the shared test key) to catch shrinker issues.
      - name: Assemble release APKs
        run: ./gradlew --console=plain :phone:assembleRelease :wear:assembleRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: heartline-release-apks
          path: |
            phone/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/paparazzi/failures/
          if-no-files-found: ignore
