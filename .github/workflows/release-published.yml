name: Release published
run-name: "Release published · ${{ github.event.release.tag_name || inputs.tag }}"

# A Build run with "Release: draft" saves the release as a draft. When it's published on GitHub
# (Releases → the draft → Publish release), this adds its notes to CHANGELOG.md (stable and beta;
# dev builds never go there) and announces it in the Telegram topic when the Build form's Telegram
# box was ticked, as the Build workflow does for releases it publishes itself.
#
# Releases the Build workflow publishes directly don't start this workflow (GitHub doesn't run
# workflows for events made with the workflow's own token), so nothing is announced twice.
# Run it by hand with a tag to announce a published release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release to announce, e.g. v1.2.0-beta.1"
        required: true
        type: string

concurrency:
  group: release-published-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Heartline release?
        id: release
        run: |
          body=$(gh release view "$TAG" --json body,isDraft,url --jq 'if .isDraft then "DRAFT" else .body end')
          url=$(gh release view "$TAG" --json url --jq .url)
          if [ "$body" = DRAFT ]; then
            echo "::error::$TAG is still a draft: publish it first."
            exit 1
          fi
          # Only releases made by the Build workflow (their text carries the run id).
          if ! grep -q "heartline-run:" <<<"$body"; then
            echo "::notice::$TAG wasn't made by the Build workflow: nothing to announce."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          channel=$(python3 -c 'import sys; sys.path.insert(0, "tools/release"); import release; v = release.parse(sys.argv[1]); print(release.channel_of(v) if v else "")' "$TAG")
          if [ -z "$channel" ]; then
            echo "::error::$TAG isn't a Heartline version tag"
            exit 1
          fi
          # The Build form's Telegram box (a run by hand always announces).
          telegram=true
          if [ "${{ github.event_name }}" = release ] && grep -q "heartline-telegram: no" <<<"$body"; then
            telegram=false
            echo "::notice::$TAG was built without the Telegram box ticked: not announced."
          fi
          { echo "channel=$channel"; echo "url=$url"; echo "telegram=$telegram"; } >> "$GITHUB_OUTPUT"
          echo "$TAG ($channel): telegram=$telegram"

      - name: Release notes from ${{ env.TAG }}
        if: steps.release.outputs.skip != 'true'
        run: python3 tools/release/release.py release-notes --tag "$TAG" --out "$RUNNER_TEMP/notes.md"

      # Drafts don't touch CHANGELOG.md; the release goes in once it's published.
      - name: Commit CHANGELOG.md
        if: steps.release.outputs.skip != 'true' && github.event_name == 'release' && steps.release.outputs.channel != 'dev'
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/release/release.py changelog --version "${TAG#v}" --notes "$RUNNER_TEMP/notes.md" --changelog CHANGELOG.md
          git add CHANGELOG.md
          git diff --cached --quiet || { git commit -m "Changelog for ${TAG#v}" && git push origin "HEAD:$DEFAULT_BRANCH"; }

      - name: Announce on Telegram
        if: steps.release.outputs.skip != 'true' && steps.release.outputs.telegram == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@HeartlineCommunity' }}
          # Topic 'Announcements & Builds' (t.me/HeartlineCommunity/5); a variable or secret overrides it.
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID || secrets.TELEGRAM_THREAD_ID || '5' }}
        run: |
          python3 tools/release/release.py telegram \
            --version "${TAG#v}" \
            --channel "${{ steps.release.outputs.channel }}" \
            --notes "$RUNNER_TEMP/notes.md" \
            --release-url "${{ steps.release.outputs.url }}"
