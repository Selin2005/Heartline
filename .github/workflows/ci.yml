name: CI

# Checks every pull request: lint, license headers, tests, screenshots and that
# docs/screenshots matches the recorded goldens.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: License headers and logging
        run: |
          python3 tools/ci/license-headers.py
          python3 tools/ci/check-logging.py

      - name: Lint
        run: ./gradlew --console=plain ktlintCheck

      - name: Unit, Robolectric and Paparazzi tests
        run: ./gradlew --console=plain test verifyPaparazziDebug

      - name: Screenshots in docs are up to date
        run: |
          pip install -q -r tools/screenshots/requirements.txt
          python3 tools/screenshots/sync.py --check

      - name: Debug build
        run: ./gradlew --console=plain :phone:assembleDebug :wear:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/paparazzi/failures/
          if-no-files-found: ignore
