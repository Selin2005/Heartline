name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Don't attach real health data or personal logs.**
        Security problems go through [private reporting](https://github.com/selin2005/heartline/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Tap …\n3. See …"
  - type: input
    id: phone_version
    attributes:
      label: Heartline version on the phone
      description: Settings → About
    validations:
      required: true
  - type: input
    id: watch_version
    attributes:
      label: Heartline version on the watch
      description: "Watch app: Settings → About"
    validations:
      required: true
  - type: input
    id: watch_model
    attributes:
      label: Watch model
      placeholder: "Galaxy Watch8 Classic"
    validations:
      required: true
  - type: input
    id: watch_one_ui
    attributes:
      label: One UI Watch and Wear OS version
      description: "On the watch: Settings → About watch → Software information"
      placeholder: "One UI 8 Watch, Wear OS 6"
    validations:
      required: true
  - type: input
    id: health_platform
    attributes:
      label: Health Platform version
      description: "On the watch: Settings → Apps → Health Platform (Health Sensor Service on older watches)"
      placeholder: "1.7.00.05"
    validations:
      required: true
  - type: input
    id: phone_model
    attributes:
      label: Phone model
      placeholder: "Galaxy S25"
    validations:
      required: true
  - type: input
    id: phone_system
    attributes:
      label: One UI and Android version on the phone
      description: "Settings → About phone → Software information. Not a Samsung phone? Only the Android version."
      placeholder: "One UI 8, Android 16"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Update channel
      options: [Stable, Beta, Google Play, Built from source]
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        In the phone app: Settings → Help & diagnostics → Export logs, then drag both files
        (heartline-phone-….log and heartline-watch-….log) here. Names are already removed; check for
        anything else you'd rather not share.
